name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        # GHCR requires a lowercase repository name; github.repository preserves case.
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: main
    steps:
      # Arcane (https://github.com/getarcaneapp/arcane) manages the compose project referenced
      # by docker-compose.prod.yml; this just tells it to pull the new :latest image and restart.
      # ARCANE_ENVIRONMENT_ID/ARCANE_PROJECT_ID identify that compose project within Arcane, not
      # secrets — hardcoded below since they're stable for this deployment.
      #
      # redeploy has a known bug where it's a no-op on an already-running project
      # (https://github.com/getarcaneapp/arcane/issues/1943), so this stops it first.
      - name: Trigger Arcane redeploy
        env:
          ARCANE_URL: ${{ secrets.ARCANE_URL }}
          ARCANE_API_KEY: ${{ secrets.ARCANE_API_KEY }}
          ARCANE_ENVIRONMENT_ID: '0'
          ARCANE_PROJECT_ID: 2271ebb0-5ece-483a-b640-e75a4d90aa2d
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
        run: |
          if [ -z "$ARCANE_URL" ] || [ -z "$ARCANE_API_KEY" ]; then
            echo "ARCANE_URL/ARCANE_API_KEY not set yet; skipping redeploy call (image pushed as $IMAGE)."
            exit 0
          fi

          base="$ARCANE_URL/api/environments/$ARCANE_ENVIRONMENT_ID/projects/$ARCANE_PROJECT_ID"

          echo "Stopping project (best-effort, ignores failure if it's not running yet)..."
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST "$base/down" -H "X-Api-Key: $ARCANE_API_KEY" || true

          echo "Redeploying with latest image ($IMAGE)..."
          status=$(curl -sS -o /tmp/arcane-redeploy.json -w '%{http_code}' -X POST "$base/redeploy" -H "X-Api-Key: $ARCANE_API_KEY")
          cat /tmp/arcane-redeploy.json
          echo
          # This is a streamed endpoint: it can return HTTP 200 with an {"error": ...} line in the
          # body even when the operation itself failed (e.g. a bad project ID), so check both.
          if [ "$status" -ge 300 ] || grep -q '"error"' /tmp/arcane-redeploy.json; then
            echo "Arcane redeploy failed (HTTP $status)"
            exit 1
          fi
