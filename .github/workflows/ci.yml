name: CI

on:
  push:
    branches-ignore: [master] # master is covered by deploy.yml calling this workflow below
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: md2
          POSTGRES_PASSWORD: md2
          POSTGRES_DB: md2_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U md2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://md2:md2@localhost:5432/md2_tracker_test
      SESSION_SECRET: ci-secret
      COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run backend migrations
        run: npm run migrate:up -w backend

      - name: Backend tests
        run: npm run test -w backend

      - name: Frontend tests
        run: npm run test -w frontend

      - name: Frontend build (smoke test)
        run: npm run build -w frontend
