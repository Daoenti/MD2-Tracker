services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: md2
      POSTGRES_PASSWORD: md2
      POSTGRES_DB: md2_tracker
    ports:
      - '5432:5432'
    volumes:
      - md2_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U md2']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache python3 make g++ && npm ci --workspace backend --include-workspace-root && npm run dev -w backend"
    environment:
      DATABASE_URL: postgres://md2:md2@db:5432/md2_tracker
      SESSION_SECRET: dev-secret
      PORT: 3000
      NODE_ENV: development
      COOKIE_SECURE: 'false'
      ALLOW_REGISTRATION: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - md2_backend_node_modules:/app/backend/node_modules
      - md2_root_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --workspace frontend --include-workspace-root && npm run dev -w frontend -- --host"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - md2_frontend_node_modules:/app/frontend/node_modules
      - md2_root_node_modules_fe:/app/node_modules
    depends_on:
      - backend

volumes:
  md2_db_data:
  md2_backend_node_modules:
  md2_frontend_node_modules:
  md2_root_node_modules:
  md2_root_node_modules_fe:
