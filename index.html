<title>Hellscape Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece2d0;
    --surface:#f8f2e6;
    --surface-2:#efe4cd;
    --surface-3:#e6d8b8;
    --border:#d7c6a4;
    --text:#241b10;
    --text-dim:#6e5c42;
    --accent:#c1531f;
    --accent-strong:#9c4419;
    --accent-ink:#fff8ef;
    --gold:#8f6b26;
    --gold-ink:#fff8ef;
    --ok:#3f7233;
    --warn:#9c6a17;
    --danger:#a03225;
    --danger-strong:#7a2119;
    --shadow:0 8px 20px rgba(54,34,12,0.16);
    --shadow-lg:0 16px 40px rgba(54,34,12,0.22);
    --radius-card:16px;
    --radius-sm:10px;
    --font-display:'Cinzel',Georgia,'Times New Roman',serif;
    --font-body:'Work Sans','Segoe UI',system-ui,sans-serif;
    --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131009;
      --surface:#1f1810;
      --surface-2:#2a2117;
      --surface-3:#382c1c;
      --border:#4a3b28;
      --text:#efe4d2;
      --text-dim:#ab9880;
      --accent:#e07b3a;
      --accent-strong:#f0965c;
      --accent-ink:#1c0f05;
      --gold:#d3ab5c;
      --gold-ink:#241a08;
      --ok:#8bab6e;
      --warn:#e0a63e;
      --danger:#e2685c;
      --danger-strong:#b6473e;
      --shadow:0 10px 24px rgba(0,0,0,0.45);
      --shadow-lg:0 20px 48px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131009;
    --surface:#1f1810;
    --surface-2:#2a2117;
    --surface-3:#382c1c;
    --border:#4a3b28;
    --text:#efe4d2;
    --text-dim:#ab9880;
    --accent:#e07b3a;
    --accent-strong:#f0965c;
    --accent-ink:#1c0f05;
    --gold:#d3ab5c;
    --gold-ink:#241a08;
    --ok:#8bab6e;
    --warn:#e0a63e;
    --danger:#e2685c;
    --danger-strong:#b6473e;
    --shadow:0 10px 24px rgba(0,0,0,0.45);
    --shadow-lg:0 20px 48px rgba(0,0,0,0.55);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    touch-action:manipulation;
    -webkit-font-smoothing:antialiased;
    padding-bottom:2rem;
  }
  h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;}

  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;
    padding:0.9rem 1.25rem;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:0.7rem;}
  .brand-mark{
    font-size:1.6rem;line-height:1;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,0.25));
  }
  .brand-text h1{font-size:1.35rem;letter-spacing:0.02em;color:var(--text);}
  .brand-text p{margin:0.15rem 0 0;font-size:0.78rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:0.9rem;}
  .field-group{display:flex;flex-direction:column;gap:0.3rem;align-items:flex-start;}
  .field-group>label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-dim);}

  .stepper{display:flex;align-items:center;gap:0.4rem;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0.25rem;}
  .stepper button{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:1.1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background .15s ease;
  }
  .stepper button:active{transform:scale(0.9);background:var(--accent);color:var(--accent-ink);}
  .stepper span{min-width:1.6rem;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;}

  .darkness-widget{display:flex;flex-direction:column;gap:0.35rem;}
  .darkness-track{display:flex;gap:0.3rem;}
  .darkness-pip{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);font-family:var(--font-mono);font-size:0.68rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s ease;
  }
  .darkness-pip.filled{background:var(--accent);border-color:var(--accent-strong);color:var(--accent-ink);}
  .darkness-pip:active{transform:scale(0.88);}
  .darkness-actions{display:flex;gap:0.35rem;margin-top:0.15rem;}
  .darkness-actions button{
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    border-radius:7px;padding:0.15rem 0.5rem;font-size:0.68rem;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;
  }

  .btn{
    border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:0.65rem 1.15rem;font-weight:600;font-size:0.92rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:0.4rem;transition:transform .08s ease,filter .15s ease;
    min-height:44px;
  }
  .btn:active{transform:scale(0.96);}
  .btn-accent{background:var(--accent);border-color:var(--accent-strong);color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:0.4rem 0.8rem;font-size:0.8rem;min-height:36px;}

  .sample-banner{
    margin:0.85rem 1.25rem 0;padding:0.7rem 1rem;background:var(--surface-2);border:1px dashed var(--border);
    border-radius:var(--radius-sm);color:var(--text-dim);font-size:0.85rem;display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center;
  }
  .sample-banner button{border:none;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:0.85rem;text-decoration:underline;}

  main.grid{
    padding:1.25rem;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1rem;
    align-items:start;
  }
  .empty-state{
    grid-column:1/-1;padding:3rem 1.5rem;text-align:center;color:var(--text-dim);
    border:1px dashed var(--border);border-radius:var(--radius-card);
  }
  .empty-state h2{color:var(--text);font-size:1.2rem;margin-bottom:0.5rem;}

  .card{
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--border);border-radius:var(--radius-card);
    box-shadow:var(--shadow);padding:0.95rem 1rem 1.1rem;
    position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--border);}
  .card.type-roaming::before{background:var(--accent);}
  .card.type-boss::before{background:var(--gold);height:6px;}
  .card.defeated{opacity:0.62;}

  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:0.6rem;margin-bottom:0.55rem;}
  .card-title{display:flex;flex-direction:column;gap:0.25rem;min-width:0;}
  .card-title h3{font-size:1.15rem;line-height:1.15;color:var(--text);word-break:break-word;}
  .tag-row{display:flex;flex-wrap:wrap;gap:0.35rem;align-items:center;}
  .tag{
    font-size:0.63rem;text-transform:uppercase;letter-spacing:0.07em;font-weight:700;
    padding:0.15rem 0.5rem;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);
  }
  .tag.mob{color:var(--text-dim);}
  .tag.roaming{color:var(--accent);border-color:var(--accent);}
  .tag.boss{color:var(--gold-ink);background:var(--gold);border-color:var(--gold);}
  .tag.defeated-tag{color:var(--danger-strong);border-color:var(--danger);}

  .icon-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
    color:var(--text-dim);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:1rem;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn.danger{color:var(--danger);}

  .subtext{font-size:0.78rem;color:var(--text-dim);}

  .health-edit{display:flex;align-items:center;gap:0.35rem;margin:0.55rem 0;flex-wrap:wrap;}
  .health-edit label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
  .health-edit input[type="number"]{
    width:4.2rem;padding:0.35rem 0.5rem;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:var(--font-mono);text-align:center;
  }

  .single-health{display:flex;align-items:center;gap:0.9rem;margin:0.6rem 0 0.8rem;}
  .single-health .stat-num{font-family:var(--font-mono);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .single-health .stat-max{font-family:var(--font-mono);font-size:1.1rem;color:var(--text-dim);}
  .bar-track{flex:1;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border);}
  .bar-fill{height:100%;border-radius:999px;transition:width .2s ease,background .2s ease;}

  .stat-ok{color:var(--ok);}
  .stat-warn{color:var(--warn);}
  .stat-danger{color:var(--danger);}
  .stat-dead{color:var(--text-dim);}
  .bar-fill.stat-ok{background:var(--ok);}
  .bar-fill.stat-warn{background:var(--warn);}
  .bar-fill.stat-danger{background:var(--danger);}
  .bar-fill.stat-dead{background:var(--border);}

  .deal-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin:0.7rem 0;padding:0.6rem;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border);}
  .deal-row input[type="number"]{
    width:4.6rem;padding:0.5rem;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:var(--font-mono);font-weight:700;text-align:center;font-size:1.05rem;
  }

  .mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:0.5rem;margin-top:0.6rem;}
  .mini{
    position:relative;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);
    display:flex;flex-direction:column;align-items:center;padding:0.4rem 0.2rem 0.3rem;user-select:none;
  }
  .mini.mini-leader{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
  .mini-crown{position:absolute;top:-9px;font-size:0.85rem;color:var(--gold);}
  .mini-tap{
    width:100%;background:none;border:none;color:inherit;cursor:pointer;padding:0.2rem 0;
    display:flex;flex-direction:column;align-items:center;
  }
  .mini-hp{font-family:var(--font-mono);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .mini-max{font-size:0.6rem;color:var(--text-dim);}
  .mini-controls{display:flex;gap:0.25rem;margin-top:0.2rem;}
  .mini-controls button{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-dim);font-size:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .mini.stat-dead{background:var(--surface-2);}
  .mini.stat-dead .mini-hp{color:var(--text-dim);}

  .boss-track-block{margin-top:0.7rem;padding-top:0.65rem;border-top:1px dashed var(--border);}
  .boss-track-row{display:flex;align-items:center;gap:0.35rem;flex-wrap:wrap;margin-top:0.4rem;}
  .boss-pip{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);
    font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .boss-pip.filled{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}

  .notes-toggle{background:none;border:none;color:var(--text-dim);font-size:0.75rem;cursor:pointer;padding:0;text-decoration:underline;margin-top:0.3rem;}
  .notes-box{margin-top:0.5rem;}
  .notes-box textarea{
    width:100%;min-height:2.4rem;resize:vertical;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface);color:var(--text);padding:0.5rem;font-size:0.85rem;
  }
  .defeated-banner{
    margin-top:0.6rem;padding:0.5rem 0.7rem;border-radius:var(--radius-sm);background:var(--danger);color:var(--accent-ink);
    font-weight:700;font-size:0.8rem;display:flex;justify-content:space-between;align-items:center;gap:0.6rem;
  }
  .defeated-banner button{border:none;background:rgba(255,255,255,0.25);color:inherit;border-radius:999px;padding:0.25rem 0.7rem;cursor:pointer;font-weight:700;font-size:0.75rem;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,10,4,0.55);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;
  }
  @media (min-width:640px){ .modal-backdrop{align-items:center;padding:1rem;} }
  .modal{
    background:var(--surface);border:1px solid var(--border);width:100%;max-width:480px;
    border-radius:20px 20px 0 0;padding:1.25rem;box-shadow:var(--shadow-lg);
    max-height:92vh;overflow-y:auto;
  }
  @media (min-width:640px){ .modal{border-radius:var(--radius-card);} }
  .modal h2{font-size:1.3rem;margin-bottom:0.9rem;}
  .modal label{display:flex;flex-direction:column;gap:0.3rem;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:0.8rem;}
  .modal input,.modal select{
    padding:0.65rem 0.7rem;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);text-transform:none;letter-spacing:normal;font-size:1rem;
  }
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0.25rem;margin-bottom:1rem;}
  .seg-btn{
    flex:1;border:none;background:none;color:var(--text-dim);padding:0.55rem 0.4rem;border-radius:999px;
    font-weight:700;font-size:0.82rem;cursor:pointer;
  }
  .seg-btn.active{background:var(--accent);color:var(--accent-ink);}
  .add-fields{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;}
  .modal-actions{display:flex;justify-content:flex-end;gap:0.6rem;margin-top:0.4rem;}

  .foot{padding:1rem 1.25rem 2rem;display:flex;flex-direction:column;align-items:center;gap:0.4rem;}
  .foot p{margin:0;font-size:0.72rem;color:var(--text-dim);}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">💀</span>
      <div class="brand-text">
        <h1>Hellscape Tracker</h1>
        <p>Massive Darkness 2 encounter log</p>
      </div>
    </div>
    <div class="controls">
      <div class="field-group">
        <label>Heroes</label>
        <div class="stepper">
          <button type="button" data-action="hero-count" data-delta="-1" aria-label="Fewer heroes">−</button>
          <span id="hero-count-val">4</span>
          <button type="button" data-action="hero-count" data-delta="1" aria-label="More heroes">+</button>
        </div>
      </div>
      <div class="field-group">
        <label id="darkness-label">Darkness · Track A</label>
        <div class="darkness-widget">
          <div class="darkness-track" id="darkness-track"></div>
          <div class="darkness-actions">
            <button type="button" data-action="darkness" data-delta="-1">− Phase</button>
            <button type="button" data-action="darkness" data-delta="1">+ Phase</button>
            <button type="button" data-action="flip-side" id="flip-side-btn" hidden>Flip to Side B</button>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-accent" data-action="open-add">+ Add Enemy</button>
    </div>
  </header>

  <p class="sample-banner" id="sample-banner" hidden>
    This is a sample encounter so you can see how the tracker works.
    <button type="button" data-action="new-encounter">Start a new encounter</button>
  </p>

  <main class="grid" id="grid"></main>

  <footer class="foot">
    <button type="button" class="btn btn-ghost btn-sm" data-action="new-encounter">Clear all &amp; start new encounter</button>
    <p>Everything here is saved automatically on this device only.</p>
  </footer>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <form class="modal" id="add-form">
    <h2>Add Enemy</h2>
    <div class="seg" id="type-seg" role="tablist">
      <button type="button" class="seg-btn active" data-type="mob" role="tab" aria-selected="true">Mob</button>
      <button type="button" class="seg-btn" data-type="roaming" role="tab" aria-selected="false">Roaming</button>
      <button type="button" class="seg-btn" data-type="boss" role="tab" aria-selected="false">Boss</button>
    </div>

    <label>Name
      <input list="name-datalist" id="add-name" autocomplete="off" placeholder="e.g. Skeletons" required>
    </label>
    <datalist id="name-datalist"></datalist>

    <label id="level-field">Dungeon level
      <select id="add-level">
        <option value="1-2">1–2</option>
        <option value="3-4">3–4</option>
        <option value="5">5</option>
        <option value="6-7">6–7</option>
        <option value="8-9">8–9</option>
        <option value="10">10</option>
      </select>
    </label>

    <div class="add-fields" id="fields-mob">
      <label>Health / miniature
        <input type="number" id="add-health-mob" min="1" value="4" inputmode="numeric">
      </label>
      <label>Minions
        <input type="number" id="add-minions" min="0" value="4" inputmode="numeric">
      </label>
    </div>

    <div class="add-fields" id="fields-single" hidden>
      <label>Health
        <input type="number" id="add-health-single" min="1" value="10" inputmode="numeric">
      </label>
    </div>

    <div class="add-fields" id="fields-boss" hidden>
      <label>Boss track length
        <input type="number" id="add-boss-track" min="1" value="8" inputmode="numeric">
      </label>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-action="close-add">Cancel</button>
      <button type="submit" class="btn btn-accent">Add to encounter</button>
    </div>
  </form>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "md2-hellscape-tracker-v1";

  var MOB_NAMES = ["Demons","Fallen Angels","Fire Entities","Gargoyles","Infernal Imps","Satyrs","Skeletons","Undead",
    "Abomination and Runners","Corrupted Angels","Cultists","Cupids","Dark Pixies","Deadeye Walkers","Dwarf Defenders",
    "Dwarf Warriors","Fatty and Walkers","Goblin Archers","Goblin Warriors","Harpies","Living Statues","Nagas","Nymphs",
    "Orc Abomination and Runners","Orc Enforcers","Orc Fatty and Walkers","Orc Flayers","Punycorns","Rattling Crossbowmen",
    "Rattling Warriors","Reptisaurian Blowgunners","Reptisaurian Warriors","Shadow Demons","Spectral Walkers",
    "Storm Elementals","Swarm of Ratz","Tainted Abomination and Walkers","Troglodyte Brutes","Troglodyte Warriors",
    "Wolfbomination and Wolfz","Wraiths"];

  var ROAMING_NAMES = ["Andra","Lydian - Incubus Lord","The Ghoul","Ytheria - Undead Queen",
    "Ablobination","Abominatroll","Abominotaur","Abyssal Demon","Amon","Archangel Raphael","Azmozeus","Banshee",
    "Beelzebub","Buer","Cerberus","Chromatis","Cliffbreaker Cyclops","Cockatrix","Cun-Ha","Death","Earth Elemental",
    "Famine","Fire Elemental","Flesh Golem","Fomorian","Giant Spider","Graz & Prug","Gryphon","Hellephant","Hellhound",
    "Hellsbane","High Troll","Iron Golem","Liliarch","Living Construct","Lord Tusk","Low Troll","Metal Angel","Minotaur",
    "Nightmare Thing","Ogre Brute","Ogre Mage","Ogre Rockbreaker","Oni","Overseer","Paragon","Plague","Queen Caenedra",
    "Rattling Agent","Rattling Bully","Reptisaurus Rex","Spearmaiden Cyclops","Troglodyte Agent","Uriel","Valkyrie",
    "Vindicator","War","Water Elemental","Werebear","Weretiger","Werewolf"];

  var BOSS_NAMES = ["Michael","The Reaper",
    "Baalberith","Charon","Cyclopes Duo","Death/Famine/Plague/War","Grundarkjell","Hades","Hellephant","Hug Bear",
    "Necromatic Dragon","Scorpion King","The Dark Emissary"];

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function defaultState(){
    return {
      heroCount: 4,
      darkness: { side: "A", pos: 3 },
      showSample: true,
      units: [
        {
          id: "sample-mob", kind: "mob", name: "Undead", level: "1-2",
          healthMax: 4, notes: "", showNotes: false,
          leader: { wounds: 0 },
          minions: [ {id:uid(),wounds:0}, {id:uid(),wounds:0}, {id:uid(),wounds:1}, {id:uid(),wounds:4} ]
        },
        {
          id: "sample-boss", kind: "boss", name: "Michael", notes: "", showNotes: false,
          healthMax: 20, wounds: 6, bossTrack: { pos: 2, max: 8 }
        }
      ]
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.units)) return defaultState();
      return parsed;
    }catch(e){
      return defaultState();
    }
  }

  var state = loadState();

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ---------- wound distribution ----------
  function healthClass(remaining, max){
    if(max <= 0) return "stat-dead";
    if(remaining <= 0) return "stat-dead";
    var pct = remaining / max;
    if(pct > 0.6) return "stat-ok";
    if(pct > 0.3) return "stat-warn";
    return "stat-danger";
  }

  function distributeMob(unit, amount, mode){
    var order;
    if(mode === "wound"){
      order = unit.minions.slice();
      order.push(unit.leader);
    } else {
      order = unit.minions.slice();
      order.push(unit.leader);
      order.sort(function(a,b){ return b.wounds - a.wounds; });
    }
    var remaining = amount;
    for(var i=0;i<order.length && remaining>0;i++){
      var m = order[i];
      if(mode === "wound"){
        var capacity = unit.healthMax - m.wounds;
        if(capacity <= 0) continue;
        var apply = Math.min(capacity, remaining);
        m.wounds += apply;
        remaining -= apply;
      } else {
        var healable = m.wounds;
        if(healable <= 0) continue;
        var applyH = Math.min(healable, remaining);
        m.wounds -= applyH;
        remaining -= applyH;
      }
    }
  }

  // ---------- rendering ----------
  var grid = document.getElementById("grid");
  var heroVal = document.getElementById("hero-count-val");
  var darknessTrack = document.getElementById("darkness-track");
  var darknessLabel = document.getElementById("darkness-label");
  var flipBtn = document.getElementById("flip-side-btn");
  var sampleBanner = document.getElementById("sample-banner");

  function render(){
    heroVal.textContent = state.heroCount;
    renderDarkness();
    renderGrid();
    sampleBanner.hidden = !state.showSample;
    save();
  }

  function renderDarkness(){
    var side = state.darkness.side;
    var max = side === "A" ? 9 : 4;
    darknessLabel.textContent = "Darkness · Track " + side;
    flipBtn.hidden = !(side === "A" && state.darkness.pos >= 9);
    var html = "";
    for(var i=1;i<=max;i++){
      html += '<button type="button" class="darkness-pip' + (i<=state.darkness.pos?' filled':'') +
        '" data-action="darkness-set" data-value="' + i + '" aria-label="Set darkness to ' + i + '">' + i + '</button>';
    }
    darknessTrack.innerHTML = html;
  }

  function miniChip(unit, mini, isLeader){
    var remaining = Math.max(0, unit.healthMax - mini.wounds);
    var cls = healthClass(remaining, unit.healthMax);
    var miniId = isLeader ? "leader" : mini.id;
    return '' +
      '<div class="mini ' + (isLeader ? 'mini-leader' : '') + '">' +
        (isLeader ? '<span class="mini-crown" aria-hidden="true">&#9819;</span>' : '') +
        '<button type="button" class="mini-tap ' + cls + '" data-action="mini-hit" data-unit="' + unit.id + '" data-mini="' + miniId + '" aria-label="' + (isLeader?'Leader':'Minion') + ' takes 1 wound">' +
          '<span class="mini-hp">' + remaining + '</span>' +
          '<span class="mini-max">/ ' + unit.healthMax + '</span>' +
        '</button>' +
        '<div class="mini-controls">' +
          '<button type="button" data-action="mini-heal" data-unit="' + unit.id + '" data-mini="' + miniId + '" aria-label="Heal 1">+</button>' +
          (isLeader ? '' : '<button type="button" data-action="mini-remove" data-unit="' + unit.id + '" data-mini="' + miniId + '" aria-label="Remove miniature">&times;</button>') +
        '</div>' +
      '</div>';
  }

  function cardMob(unit){
    var leaderDead = unit.leader.wounds >= unit.healthMax;
    var minisHtml = miniChip(unit, unit.leader, true);
    unit.minions.forEach(function(m){ minisHtml += miniChip(unit, m, false); });
    var levelTxt = unit.level ? ("Lvl " + unit.level + " · ") : "";
    return '' +
      '<article class="card type-mob' + (leaderDead ? ' defeated' : '') + '" data-unit-card="' + unit.id + '">' +
        '<div class="card-head">' +
          '<div class="card-title">' +
            '<h3>' + escapeHtml(unit.name) + '</h3>' +
            '<div class="tag-row"><span class="tag mob">Mob</span>' + (leaderDead ? '<span class="tag defeated-tag">Defeated</span>' : '') + '</div>' +
          '</div>' +
          '<button type="button" class="icon-btn danger" data-action="remove-unit" data-unit="' + unit.id + '" aria-label="Remove card">&times;</button>' +
        '</div>' +
        '<p class="subtext">' + levelTxt + '1 Leader + ' + unit.minions.length + ' Minion' + (unit.minions.length===1?'':'s') + '</p>' +
        '<div class="health-edit">' +
          '<label>Health / mini</label>' +
          '<input type="number" min="1" value="' + unit.healthMax + '" data-field="healthMax" data-unit="' + unit.id + '">' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="add-minion" data-unit="' + unit.id + '">+ Minion</button>' +
        '</div>' +
        '<div class="deal-row">' +
          '<input type="number" min="1" value="1" id="deal-' + unit.id + '" inputmode="numeric" aria-label="Wound amount">' +
          '<button type="button" class="btn btn-accent btn-sm" data-action="wound" data-unit="' + unit.id + '">Wound</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="heal" data-unit="' + unit.id + '">Heal</button>' +
        '</div>' +
        '<div class="mini-grid">' + minisHtml + '</div>' +
        notesBlock(unit) +
        (leaderDead ? '<div class="defeated-banner"><span>Mob defeated</span><button type="button" data-action="remove-unit" data-unit="' + unit.id + '">Remove</button></div>' : '') +
      '</article>';
  }

  function cardSingle(unit){
    var remaining = Math.max(0, unit.healthMax - unit.wounds);
    var cls = healthClass(remaining, unit.healthMax);
    var pct = unit.healthMax > 0 ? Math.max(0, Math.min(100, (remaining/unit.healthMax)*100)) : 0;
    var isBoss = unit.kind === "boss";
    var levelTxt = (!isBoss && unit.level) ? ("Level " + unit.level) : "";
    var dead = remaining <= 0;

    var bossTrackHtml = "";
    if(isBoss){
      var pips = "";
      for(var i=1;i<=unit.bossTrack.max;i++){
        pips += '<button type="button" class="boss-pip' + (i<=unit.bossTrack.pos?' filled':'') + '" data-action="boss-track-set" data-unit="' + unit.id + '" data-value="' + i + '" aria-label="Set boss track to ' + i + '">' + i + '</button>';
      }
      bossTrackHtml = '' +
        '<div class="boss-track-block">' +
          '<p class="subtext">Boss track</p>' +
          '<div class="boss-track-row">' + pips + '</div>' +
        '</div>';
    }

    return '' +
      '<article class="card type-' + unit.kind + (dead ? ' defeated' : '') + '" data-unit-card="' + unit.id + '">' +
        '<div class="card-head">' +
          '<div class="card-title">' +
            '<h3>' + escapeHtml(unit.name) + '</h3>' +
            '<div class="tag-row"><span class="tag ' + unit.kind + '">' + (isBoss ? "Boss" : "Roaming") + '</span>' + (dead ? '<span class="tag defeated-tag">Defeated</span>' : '') + '</div>' +
          '</div>' +
          '<button type="button" class="icon-btn danger" data-action="remove-unit" data-unit="' + unit.id + '" aria-label="Remove card">&times;</button>' +
        '</div>' +
        (levelTxt ? '<p class="subtext">' + levelTxt + '</p>' : '') +
        '<div class="health-edit">' +
          '<label>Max health</label>' +
          '<input type="number" min="1" value="' + unit.healthMax + '" data-field="healthMax" data-unit="' + unit.id + '">' +
        '</div>' +
        '<div class="single-health">' +
          '<span class="stat-num ' + cls + '">' + remaining + '</span>' +
          '<span class="stat-max">/ ' + unit.healthMax + '</span>' +
          '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<div class="deal-row">' +
          '<input type="number" min="1" value="1" id="deal-' + unit.id + '" inputmode="numeric" aria-label="Wound amount">' +
          '<button type="button" class="btn btn-accent btn-sm" data-action="wound" data-unit="' + unit.id + '">Wound</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="heal" data-unit="' + unit.id + '">Heal</button>' +
        '</div>' +
        bossTrackHtml +
        notesBlock(unit) +
        (dead ? '<div class="defeated-banner"><span>Defeated</span><button type="button" data-action="remove-unit" data-unit="' + unit.id + '">Remove</button></div>' : '') +
      '</article>';
  }

  function notesBlock(unit){
    return '' +
      '<button type="button" class="notes-toggle" data-action="toggle-notes" data-unit="' + unit.id + '">' +
        (unit.showNotes ? "Hide notes" : (unit.notes ? "Edit notes" : "+ Add notes")) +
      '</button>' +
      (unit.showNotes ?
        '<div class="notes-box"><textarea data-field="notes" data-unit="' + unit.id + '" placeholder="Conditions, tokens, abilities...">' + escapeHtml(unit.notes) + '</textarea></div>'
        : (unit.notes ? '<p class="subtext">' + escapeHtml(unit.notes) + '</p>' : ''));
  }

  function renderGrid(){
    var bosses = state.units.filter(function(u){ return u.kind === "boss"; });
    var roaming = state.units.filter(function(u){ return u.kind === "roaming"; });
    var mobs = state.units.filter(function(u){ return u.kind === "mob"; });
    var ordered = bosses.concat(roaming, mobs);

    if(ordered.length === 0){
      grid.innerHTML = '<div class="empty-state"><h2>No enemies on the board</h2><p>Tap "+ Add Enemy" to log a Mob, Roaming Monster, or Boss.</p></div>';
      return;
    }

    grid.innerHTML = ordered.map(function(u){
      return u.kind === "mob" ? cardMob(u) : cardSingle(u);
    }).join("");
  }

  function findUnit(id){
    for(var i=0;i<state.units.length;i++) if(state.units[i].id === id) return state.units[i];
    return null;
  }

  // ---------- add-enemy modal ----------
  var backdrop = document.getElementById("modal-backdrop");
  var form = document.getElementById("add-form");
  var typeSeg = document.getElementById("type-seg");
  var currentType = "mob";
  var nameInput = document.getElementById("add-name");
  var nameDatalist = document.getElementById("name-datalist");
  var levelField = document.getElementById("level-field");
  var fieldsMob = document.getElementById("fields-mob");
  var fieldsSingle = document.getElementById("fields-single");
  var fieldsBoss = document.getElementById("fields-boss");

  function namesFor(type){
    if(type === "mob") return MOB_NAMES;
    if(type === "roaming") return ROAMING_NAMES;
    return BOSS_NAMES;
  }

  function setModalType(type){
    currentType = type;
    Array.prototype.forEach.call(typeSeg.querySelectorAll(".seg-btn"), function(btn){
      var active = btn.getAttribute("data-type") === type;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });
    nameDatalist.innerHTML = namesFor(type).map(function(n){ return '<option value="' + escapeHtml(n) + '">'; }).join("");
    levelField.hidden = type === "boss";
    fieldsMob.hidden = type !== "mob";
    fieldsSingle.hidden = type === "mob";
    document.getElementById("add-health-single").value = type === "boss" ? 20 : 10;
    fieldsBoss.hidden = type !== "boss";
    nameInput.value = "";
    nameInput.focus();
  }

  function openModal(){
    backdrop.hidden = false;
    setModalType("mob");
    document.getElementById("add-minions").value = state.heroCount;
  }
  function closeModal(){ backdrop.hidden = true; form.reset(); }

  typeSeg.addEventListener("click", function(e){
    var btn = e.target.closest(".seg-btn");
    if(!btn) return;
    setModalType(btn.getAttribute("data-type"));
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameInput.value.trim();
    if(!name) return;
    var level = document.getElementById("add-level").value;

    if(currentType === "mob"){
      var healthMax = Math.max(1, parseInt(document.getElementById("add-health-mob").value, 10) || 1);
      var minionCount = Math.max(0, parseInt(document.getElementById("add-minions").value, 10) || 0);
      var minions = [];
      for(var i=0;i<minionCount;i++) minions.push({ id: uid(), wounds: 0 });
      state.units.push({
        id: uid(), kind: "mob", name: name, level: level, healthMax: healthMax,
        notes: "", showNotes: false, leader: { wounds: 0 }, minions: minions
      });
    } else if(currentType === "roaming"){
      var hMax = Math.max(1, parseInt(document.getElementById("add-health-single").value, 10) || 1);
      state.units.push({
        id: uid(), kind: "roaming", name: name, level: level, healthMax: hMax,
        wounds: 0, notes: "", showNotes: false
      });
    } else {
      var bMax = Math.max(1, parseInt(document.getElementById("add-health-single").value, 10) || 1);
      var trackMax = Math.max(1, parseInt(document.getElementById("add-boss-track").value, 10) || 1);
      state.units.push({
        id: uid(), kind: "boss", name: name, healthMax: bMax, wounds: 0,
        notes: "", showNotes: false, bossTrack: { pos: 0, max: trackMax }
      });
    }
    state.showSample = false;
    closeModal();
    render();
  });

  // ---------- delegated actions ----------
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "open-add"){ openModal(); return; }
    if(action === "close-add"){ closeModal(); return; }

    if(action === "hero-count"){
      var d = parseInt(el.getAttribute("data-delta"), 10);
      state.heroCount = Math.max(1, Math.min(6, state.heroCount + d));
      render();
      return;
    }

    if(action === "darkness"){
      var delta = parseInt(el.getAttribute("data-delta"), 10);
      moveDarkness(delta);
      render();
      return;
    }
    if(action === "darkness-set"){
      state.darkness.pos = parseInt(el.getAttribute("data-value"), 10);
      render();
      return;
    }
    if(action === "flip-side"){
      state.darkness.side = "B";
      state.darkness.pos = 1;
      render();
      return;
    }

    if(action === "new-encounter"){
      if(confirm("Clear the board and start a new encounter?")){
        state.units = [];
        state.showSample = false;
        render();
      }
      return;
    }

    var unitId = el.getAttribute("data-unit");
    var unit = unitId ? findUnit(unitId) : null;

    if(action === "remove-unit"){
      state.units = state.units.filter(function(u){ return u.id !== unitId; });
      render();
      return;
    }

    if(!unit) return;

    if(action === "wound" || action === "heal"){
      var input = document.getElementById("deal-" + unitId);
      var amount = Math.max(0, parseInt(input.value, 10) || 0);
      if(amount <= 0) return;
      var mode = action === "wound" ? "wound" : "heal";
      if(unit.kind === "mob"){
        distributeMob(unit, amount, mode);
      } else {
        if(mode === "wound") unit.wounds = Math.min(unit.healthMax, unit.wounds + amount);
        else unit.wounds = Math.max(0, unit.wounds - amount);
      }
      render();
      return;
    }

    if(action === "mini-hit" || action === "mini-heal" || action === "mini-remove"){
      var miniId = el.getAttribute("data-mini");
      var target = null;
      if(miniId === "leader"){
        target = unit.leader;
      } else {
        for(var i=0;i<unit.minions.length;i++){ if(unit.minions[i].id === miniId){ target = unit.minions[i]; break; } }
      }
      if(!target) return;
      if(action === "mini-hit") target.wounds = Math.min(unit.healthMax, target.wounds + 1);
      if(action === "mini-heal") target.wounds = Math.max(0, target.wounds - 1);
      if(action === "mini-remove"){
        unit.minions = unit.minions.filter(function(m){ return m.id !== miniId; });
      }
      render();
      return;
    }

    if(action === "add-minion"){
      unit.minions.push({ id: uid(), wounds: 0 });
      render();
      return;
    }

    if(action === "toggle-notes"){
      unit.showNotes = !unit.showNotes;
      render();
      return;
    }

    if(action === "boss-track-set"){
      unit.bossTrack.pos = parseInt(el.getAttribute("data-value"), 10);
      render();
      return;
    }
  });

  document.addEventListener("change", function(e){
    var el = e.target;
    var field = el.getAttribute && el.getAttribute("data-field");
    if(!field) return;
    var unitId = el.getAttribute("data-unit");
    var unit = findUnit(unitId);
    if(!unit) return;

    if(field === "healthMax"){
      var val = Math.max(1, parseInt(el.value, 10) || 1);
      unit.healthMax = val;
      render();
    } else if(field === "notes"){
      unit.notes = el.value;
      save();
    }
  });

  function moveDarkness(delta){
    var d = state.darkness;
    var max = d.side === "A" ? 9 : 4;
    d.pos += delta;
    if(d.pos > max){
      if(d.side === "A"){ d.side = "B"; d.pos = 1; }
      else { d.pos = 1; }
    }
    if(d.pos < 1) d.pos = 1;
  }

  backdrop.addEventListener("click", function(e){
    if(e.target === backdrop) closeModal();
  });

  render();
})();
</script>
