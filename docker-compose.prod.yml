# What Arcane runs. Reflects the actual deployed config: app + db on an internal network,
# app also on the external traefik_proxy network so Traefik can route md2.thecowsaysmoo.net to it.
# Set IMAGE to override the GHCR image built by .github/workflows/deploy.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: md2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: md2_tracker
    volumes:
      - md2_db_data:/var/lib/postgresql/data
    networks:
      - md2_tracker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U md2']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE:-ghcr.io/daoenti/md2-tracker:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://md2:${POSTGRES_PASSWORD}@db:5432/md2_tracker
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3004
      NODE_ENV: production
      ALLOW_REGISTRATION: 'false'
      COOKIE_SECURE: 'true'
    networks:
      - traefik_proxy
      - md2_tracker
    labels:
      traefik.enable: "true"
      # Required because app sits on two networks — without this Traefik can't tell
      # which one to route through and silently drops the router (404, not 502).
      traefik.docker.network: traefik_proxy
      traefik.http.routers.md2tracker.entrypoints: https
      traefik.http.routers.md2tracker.rule: Host(`md2.thecowsaysmoo.net`)
      traefik.http.routers.md2tracker.tls: "true"
      traefik.http.services.md2tracker.loadbalancer.server.port: "3004"
    depends_on:
      db:
        condition: service_healthy

volumes:
  md2_db_data:

networks:
  md2_tracker:
  traefik_proxy:
    external: true
